name: mattermost

services:
  postgres:
    image: postgres:15-alpine
    container_name: mattermost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: change-me-to-a-long-random-string
      POSTGRES_DB: mattermost
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U mmuser -d mattermost
      interval: 30s
      timeout: 5s
      retries: 5

  mattermost:
    image: mattermost/mattermost-team-edition:10.2
    container_name: mattermost
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - target: 8065
        published: "8065"
        protocol: tcp
    environment:
      TZ: America/Sao_Paulo
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:change-me-to-a-long-random-string@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /mattermost/data
      - type: bind
        source: /DATA/AppData/$AppID/logs
        target: /mattermost/logs
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /mattermost/config
      - type: bind
        source: /DATA/AppData/$AppID/plugins
        target: /mattermost/plugins
      - type: bind
        source: /DATA/AppData/$AppID/client-plugins
        target: /mattermost/client/plugins

x-casaos:
  architectures:
    - amd64
    - arm64
  main: mattermost
  author: C0RUJA0
  developer: Mattermost
  category: Communication
  icon: https://cdn.jsdelivr.net/gh/roqueribeiro/roqueos-containers-list@main/Apps/Mattermost/icon.png
  title:
    en_us: Mattermost
    pt_br: Mattermost
  tagline:
    en_us: Self-hosted Slack alternative
    pt_br: Alternativa auto-hospedada ao Slack
  description:
    en_us: Mattermost Team Edition with PostgreSQL.
    pt_br: Mattermost Team Edition com PostgreSQL.
  scheme: http
  index: /
  port_map: "8065"
  tips:
    before_install:
      en_us: |
        Before first boot, replace POSTGRES_PASSWORD and the password inside MM_SQLSETTINGS_DATASOURCE with the same long random string.
      pt_br: |
        Antes do primeiro boot, substitua POSTGRES_PASSWORD e a senha dentro de MM_SQLSETTINGS_DATASOURCE pela mesma string aleatoria longa.
